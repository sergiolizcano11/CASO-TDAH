<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Défi des Nationalités - Unir</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #F3F4F6; 
            color: #0F172A; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn-dua {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-dua:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .selected-item {
            border-color: #2563EB !important;
            background-color: #EFF6FF !important;
            box-shadow: 0 0 0 4px #BFDBFE;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-6 md:p-10 border-4 border-slate-800">
        
        <!-- Pantalla de Inicio -->
        <section id="start-screen" class="text-center fade-in">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-6 text-slate-900 leading-tight">
                🔗 Le Défi des Nationalités: Unir
            </h1>
            <p class="text-2xl mb-8 font-medium">
                Une cada personaje o ciudad con su nacionalidad correcta en francés.
            </p>
            <div class="flex justify-center bg-blue-50 border-2 border-blue-800 rounded-xl p-4 mb-8">
                <p class="text-xl font-bold flex items-center gap-3">
                    <span>💡</span> Selecciona primero un elemento de la izquierda y luego su pareja a la derecha.
                </p>
            </div>
            <button onclick="iniciarJuego()" class="btn-dua w-full bg-yellow-400 hover:bg-yellow-300 border-b-8 border-yellow-600 text-slate-900 text-3xl font-extrabold py-5 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-slate-900">
                <span>▶️</span> COMENZAR RETO
            </button>
        </section>

        <!-- Pantalla de Juego (Unir parejas paso a paso) -->
        <section id="game-screen" class="hidden text-center">
            <!-- Indicador de progreso -->
            <div class="flex justify-between items-center mb-6 border-b-4 border-slate-200 pb-4">
                <span class="text-2xl font-bold">Reto <span id="current-step">1</span> de <span id="total-steps">4</span></span>
                <span class="text-2xl font-bold bg-slate-800 text-white px-4 py-1 rounded-lg">⭐ <span id="score">0</span> pts</span>
            </div>

            <p id="instruction-text" class="text-2xl font-semibold mb-6 text-blue-900">
                Haz clic en el origen y únelo con su nacionalidad:
            </p>

            <!-- Panel de Unir Parejas -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Columna Orígenes -->
                <div id="origins-container" class="flex flex-col gap-4">
                    <!-- Generado por JS -->
                </div>
                <!-- Columna Destinos (Nacionalidades mezcladas) -->
                <div id="destinations-container" class="flex flex-col gap-4">
                    <!-- Generado por JS -->
                </div>
            </div>

            <!-- Feedback Visual -->
            <div id="feedback-container" class="hidden rounded-xl p-4 mb-4 border-4">
                <p id="feedback-text" class="text-2xl font-extrabold flex items-center justify-center gap-3"></p>
            </div>

            <!-- Botón Siguiente -->
            <button id="next-btn" onclick="siguienteReto()" class="hidden btn-dua w-full bg-slate-800 hover:bg-slate-700 border-b-8 border-slate-900 text-white text-3xl font-bold py-4 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-slate-400">
                <span>Siguiente Reto</span> <span>⏭️</span>
            </button>
        </section>

        <!-- Pantalla de Resultados -->
        <section id="result-screen" class="hidden text-center fade-in">
            <h2 class="text-5xl font-extrabold mb-6 text-slate-900">🏁 ¡Terminado!</h2>
            <p class="text-3xl mb-8">Has conseguido:</p>
            <div class="inline-block bg-yellow-400 border-4 border-slate-900 rounded-full w-40 h-40 flex items-center justify-center mx-auto mb-8 shadow-lg">
                <span class="text-6xl font-black text-slate-900" id="final-score">0</span>
            </div>
            <p class="text-2xl font-bold mb-8" id="final-message"></p>
            
            <button onclick="reiniciarJuego()" class="btn-dua w-full bg-emerald-500 hover:bg-emerald-400 border-b-8 border-emerald-700 text-slate-900 text-3xl font-extrabold py-5 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-slate-900">
                <span>🔄</span> JUGAR OTRA VEZ
            </button>
        </section>

    </main>

    <script>
        // Datos del juego adaptados para unir parejas por pantalla (paso a paso DUA)
        const retos = [
            {
                id: 1,
                origen: "👨 Pierre est de Paris.",
                destinoCorrecto: "français 🇫🇷",
                opcionesDestino: ["français 🇫🇷", "espagnole 🇪🇸"]
            },
            {
                id: 2,
                origen: "👩 Maria est de Madrid.",
                destinoCorrecto: "espagnole 🇪🇸",
                opcionesDestino: ["italienne 🇮🇹", "espagnole 🇪🇸"]
            },
            {
                id: 3,
                origen: "👨‍👦 John et Paul sont de Londres.",
                destinoCorrecto: "anglais 🇬🇧",
                opcionesDestino: ["anglais 🇬🇧", "française 🇫🇷"]
            },
            {
                id: 4,
                origen: "👩 Giulia est de Rome.",
                destinoCorrecto: "italienne 🇮🇹",
                opcionesDestino: ["espagnol 🇪🇸", "italienne 🇮🇹"]
            }
        ];

        let indiceActual = 0;
        let puntuacion = 0;
        let elementoSeleccionadoOrigen = null;

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const originsContainer = document.getElementById('origins-container');
        const destinationsContainer = document.getElementById('destinations-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const scoreElement = document.getElementById('score');
        const currentStepElement = document.getElementById('current-step');
        const totalStepsElement = document.getElementById('total-steps');

        totalStepsElement.textContent = retos.length;

        function iniciarJuego() {
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            indiceActual = 0;
            puntuacion = 0;
            actualizarPuntuacion();
            mostrarReto();
        }

        function mostrarReto() {
            feedbackContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');
            originsContainer.innerHTML = '';
            destinationsContainer.innerHTML = '';
            elementoSeleccionadoOrigen = null;

            const retoActual = retos[indiceActual];
            currentStepElement.textContent = indiceActual + 1;

            // Renderizar origen (tarjeta única del paso)
            const origenBtn = document.createElement('div');
            origenBtn.className = "btn-dua bg-blue-50 border-4 border-blue-800 text-blue-950 text-2xl font-bold p-6 rounded-xl flex items-center justify-center cursor-pointer shadow-sm";
            origenBtn.textContent = retoActual.origen;
            origenBtn.onclick = () => seleccionarOrigen(origenBtn, retoActual.origen);
            originsContainer.appendChild(origenBtn);

            // Renderizar destinos (mezclados)
            const destinosMezclados = [...retoActual.opcionesDestino].sort(() => Math.random() - 0.5);
            destinosMezclados.forEach(destino => {
                const destBtn = document.createElement('button');
                destBtn.className = "btn-dua w-full bg-white border-4 border-slate-300 hover:border-slate-800 text-slate-800 text-2xl font-bold py-6 px-4 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500 shadow-sm";
                destBtn.textContent = destino;
                destBtn.onclick = () => verificarUnificacion(destino, destBtn);
                destinationsContainer.appendChild(destBtn);
            });
        }

        function seleccionarOrigen(btn, texto) {
            // Desmarcar otros si hubiera
            originsContainer.querySelectorAll('div').forEach(b => b.classList.remove('selected-item'));
            btn.classList.add('selected-item');
            elementoSeleccionadoOrigen = texto;
        }

        function verificarUnificacion(destinoSeleccionado, btnDestino) {
            const retoActual = retos[indiceActual];
            
            // Deshabilitar botones de destino tras la elección
            const botonesDestino = destinationsContainer.querySelectorAll('button');
            botonesDestino.forEach(b => b.disabled = true);

            feedbackContainer.classList.remove('hidden');
            feedbackContainer.classList.add('fade-in');

            if (destinoSeleccionado === retoActual.destinoCorrecto) {
                puntuacion += 10;
                actualizarPuntuacion();
                
                btnDestino.classList.replace('border-slate-300', 'border-emerald-600');
                btnDestino.classList.add('bg-emerald-100');

                feedbackContainer.className = 'rounded-xl p-4 mb-4 border-4 border-emerald-600 bg-emerald-50 fade-in';
                feedbackText.className = 'text-2xl font-extrabold flex items-center justify-center gap-3 text-emerald-800';
                feedbackText.innerHTML = '<span>✅</span> ¡Excelente unión! C\'est correct.';
            } else {
                btnDestino.classList.replace('border-slate-300', 'border-red-600');
                btnDestino.classList.add('bg-red-100');

                feedbackContainer.className = 'rounded-xl p-4 mb-4 border-4 border-red-600 bg-red-50 fade-in';
                feedbackText.className = 'text-2xl font-extrabold flex items-center justify-center gap-3 text-red-800';
                feedbackText.innerHTML = '<span>❌</span> No es correcto. Revisa la nacionalidad.';
            }

            nextBtn.classList.remove('hidden');
            nextBtn.classList.add('fade-in');
        }

        function siguienteReto() {
            indiceActual++;
            if (indiceActual < retos.length) {
                mostrarReto();
            } else {
                mostrarResultados();
            }
        }

        function mostrarResultados() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = puntuacion;
            
            const mensajeFinal = document.getElementById('final-message');
            if (puntuacion === 40) {
                mensajeFinal.textContent = "🏆 ¡Parfait! Has unificado todas las nacionalidades con éxito.";
            } else if (puntuacion >= 20) {
                mensajeFinal.textContent = "👍 ¡Très bien! Buen trabajo uniendo las parejas.";
            } else {
                mensajeFinal.textContent = "💪 ¡Courage! Sigue practicando las reglas de género y país.";
            }
        }

        function reiniciarJuego() {
            resultScreen.classList.add('hidden');
            iniciarJuego();
        }
        
        function actualizarPuntuacion() {
            scoreElement.textContent = puntuacion;
        }
    </script>
</body>
</html>
