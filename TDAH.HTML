<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Mapa Geológico de España y sus Capas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos DUA: Alto contraste y accesibilidad visual */
        body { 
            background-color: #0F172A; /* Fondo muy oscuro para máximo contraste */
            color: #F8FAFC; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn-dua {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-dua:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <main class="w-full max-w-2xl bg-slate-900 rounded-3xl shadow-2xl p-6 md:p-10 border-4 border-yellow-400">
        
        <!-- Pantalla de Inicio -->
        <section id="start-screen" class="text-center fade-in">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-6 text-yellow-300 leading-tight">
                🗺️ El Mapa Geológico de España y sus Capas
            </h1>
            <p class="text-2xl mb-8 font-medium text-slate-200">
                Aprende geología paso a paso sin distracciones. Ideal para 3.º de ESO.
            </p>
            <div class="flex justify-center bg-slate-800 border-2 border-yellow-400 rounded-2xl p-4 mb-8">
                <p class="text-xl font-bold flex items-center gap-3 text-left text-yellow-200">
                    <span>💡</span> Una sola pregunta por pantalla para facilitar la concentración.
                </p>
            </div>
            <button onclick="iniciarJuego()" class="btn-dua w-full bg-yellow-400 hover:bg-yellow-300 border-b-8 border-yellow-600 text-slate-950 text-3xl font-extrabold py-5 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-white">
                <span>▶️</span> COMENZAR RETO
            </button>
        </section>

        <!-- Pantalla de Juego (Paso a paso / DUA) -->
        <section id="game-screen" class="hidden text-center">
            <!-- Indicador de progreso -->
            <div class="flex justify-between items-center mb-8 border-b-4 border-slate-700 pb-4">
                <span class="text-2xl font-bold text-yellow-300">Paso <span id="current-step">1</span> de <span id="total-steps">4</span></span>
                <span class="text-2xl font-bold bg-yellow-400 text-slate-950 px-4 py-1 rounded-xl">⭐ <span id="score">0</span> pts</span>
            </div>

            <!-- Pregunta actual -->
            <div id="question-container" class="fade-in mb-8">
                <p id="question-context" class="text-2xl font-semibold mb-4 text-cyan-300"></p>
                <p id="question-text" class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-8 bg-yellow-100 p-6 rounded-2xl border-4 border-yellow-400"></p>
                
                <!-- Opciones (Botones grandes) -->
                <div id="options-container" class="grid grid-cols-1 gap-6">
                    <!-- Generado dinámicamente desde JS -->
                </div>
            </div>

            <!-- Feedback Visual -->
            <div id="feedback-container" class="hidden rounded-2xl p-6 mb-6 border-4">
                <p id="feedback-text" class="text-3xl font-extrabold flex items-center justify-center gap-4"></p>
            </div>

            <!-- Botón Siguiente -->
            <button id="next-btn" onclick="siguientePregunta()" class="hidden btn-dua w-full bg-cyan-500 hover:bg-cyan-400 border-b-8 border-cyan-700 text-slate-950 text-3xl font-bold py-4 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-white">
                <span>Siguiente Paso</span> <span>⏭️</span>
            </button>
        </section>

        <!-- Pantalla de Resultados -->
        <section id="result-screen" class="hidden text-center fade-in">
            <h2 class="text-4xl md:text-5xl font-extrabold mb-6 text-yellow-300">🏁 ¡Reto Completado!</h2>
            <p class="text-3xl mb-8">Puntuación final:</p>
            <div class="inline-block bg-yellow-400 border-4 border-white rounded-full w-40 h-40 flex items-center justify-center mx-auto mb-8 shadow-lg">
                <span class="text-6xl font-black text-slate-950" id="final-score">0</span>
            </div>
            <p class="text-2xl font-bold mb-8 text-cyan-200" id="final-message"></p>
            
            <button onclick="reiniciarJuego()" class="btn-dua w-full bg-emerald-400 hover:bg-emerald-300 border-b-8 border-emerald-600 text-slate-950 text-3xl font-extrabold py-5 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-white">
                <span>🔄</span> JUGAR OTRA VEZ
            </button>
        </section>

    </main>

    <script>
        // Web Audio API para tonos cortos de acierto y error sin archivos externos
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Datos adaptados a 3.º de ESO: El Mapa Geológico de España y sus Capas
        const preguntas = [
            {
                contexto: "Pregunta 1: Leyenda y Colores 🌋",
                pregunta: "¿Qué representa habitualmente el color rojo o las tramas ígneas en un mapa geológico de España?",
                opciones: [
                    { texto: "Rocas magmáticas o volcánicas 🌋", correcto: true },
                    { texto: "Zonas llanas de acumulación de arena 💧", correcto: false },
                    { texto: "Cuencas sedimentarias recientes ⛰️", correcto: false }
                ]
            },
            {
                contexto: "Pregunta 2: Hidrogeología y Acuíferos 💧",
                pregunta: "En los mapas geológicos, ¿qué tipo de materiales asociamos comúnmente con la presencia de acuíferos subterráneos importantes?",
                opciones: [
                    { texto: "Materiales impermeables como arcillas compactas", correcto: false },
                    { texto: "Materiales permeables como calizas y arenas 💧", correcto: true },
                    { texto: "Estructuras exclusivamente graníticas profundas", correcto: false }
                ]
            },
            {
                contexto: "Pregunta 3: Las grandes unidades ⛰️",
                pregunta: "La Península Ibérica se divide geológicamente en la Hespérica (zócalo paleozoico) y...",
                opciones: [
                    { texto: "Las cuencas alpinas y cenozoicas, y cordilleras alpinas ⛰️", correcto: true },
                    { texto: "Únicamente llanuras volcánicas submarinas antiguas", correcto: false },
                    { texto: "Bloques rígidos formados exclusivamente en el Precámbrico", correcto: false }
                ]
            },
            {
                contexto: "Pregunta 4: Capas y Cronología 🗺️",
                pregunta: "En la superposición de capas de un mapa geológico, ¿cómo se sitúan generalmente los estratos según la estratigrafía?",
                opciones: [
                    { texto: "Los más modernos siempre están abajo y los antiguos arriba", correcto: false },
                    { texto: "Los estratos más antiguos se sitúan en la base y los más modernos encima 🗺️", correcto: true },
                    { texto: "La posición de las capas es totalmente aleatoria", correcto: false }
                ]
            }
        ];

        let indiceActual = 0;
        let puntuacion = 0;

        // Referencias DOM
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionContext = document.getElementById('question-context');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const scoreElement = document.getElementById('score');
        const currentStepElement = document.getElementById('current-step');
        const totalStepsElement = document.getElementById('total-steps');

        totalStepsElement.textContent = preguntas.length;

        function iniciarJuego() {
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            indiceActual = 0;
            puntuacion = 0;
            actualizarPuntuacion();
            mostrarPregunta();
        }

        function mostrarPregunta() {
            feedbackContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            const preguntaActual = preguntas[indiceActual];
            currentStepElement.textContent = indiceActual + 1;
            
            questionContext.textContent = preguntaActual.contexto;
            questionText.textContent = preguntaActual.pregunta;

            preguntaActual.opciones.forEach((opcion) => {
                const btn = document.createElement('button');
                // Botones grandes, texto muy legible, contraste optimizado
                btn.className = `btn-dua w-full bg-slate-800 border-4 border-slate-600 hover:border-yellow-400 text-white text-2xl md:text-3xl font-bold py-5 px-6 rounded-2xl text-left flex items-center justify-between focus:outline-none focus:ring-4 focus:ring-yellow-400`;
                btn.textContent = opcion.texto;
                btn.onclick = () => verificarRespuesta(opcion.correcto, btn);
                optionsContainer.appendChild(btn);
            });

            const qc = document.getElementById('question-container');
            qc.classList.remove('fade-in');
            void qc.offsetWidth; 
            qc.classList.add('fade-in');
        }

        function verificarRespuesta(esCorrecto, btnSeleccionado) {
            const botones = optionsContainer.querySelectorAll('button');
            botones.forEach(btn => btn.disabled = true);

            feedbackContainer.classList.remove('hidden');
            feedbackContainer.classList.add('fade-in');
            
            if (esCorrecto) {
                puntuacion += 25;
                actualizarPuntuacion();
                playSound('success');
                
                btnSeleccionado.classList.replace('border-slate-600', 'border-emerald-400');
                btnSeleccionado.classList.add('bg-emerald-950');
                
                feedbackContainer.className = 'rounded-2xl p-6 mb-6 border-4 border-emerald-400 bg-emerald-950 fade-in';
                feedbackText.className = 'text-3xl font-extrabold flex items-center justify-center gap-4 text-emerald-300';
                feedbackText.innerHTML = '<span>✅</span> ¡Excelente! ¡Respuesta correcta!';
            } else {
                playSound('error');
                
                btnSeleccionado.classList.replace('border-slate-600', 'border-rose-500');
                btnSeleccionado.classList.add('bg-rose-950');
                
                feedbackContainer.className = 'rounded-2xl p-6 mb-6 border-4 border-rose-500 bg-rose-950 fade-in';
                feedbackText.className = 'text-3xl font-extrabold flex items-center justify-center gap-4 text-rose-300';
                feedbackText.innerHTML = '<span>❌</span> ¡Vaya! Revisa bien el concepto geológico.';
            }

            nextBtn.classList.remove('hidden');
            nextBtn.classList.add('fade-in');
        }

        function siguientePregunta() {
            indiceActual++;
            if (indiceActual < preguntas.length) {
                mostrarPregunta();
            } else {
                mostrarResultados();
            }
        }

        function mostrarResultados() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = puntuacion;
            
            const mensajeFinal = document.getElementById('final-message');
            if (puntuacion === 100) {
                mensajeFinal.textContent = "🏆 ¡Geólogo experto! Has dominado el mapa y sus capas.";
            } else if (puntuacion >= 50) {
                mensajeFinal.textContent = "👍 ¡Buen trabajo! Tienes una sólida base de geología.";
            } else {
                mensajeFinal.textContent = "💪 ¡Sigue practicando! Repasa los apuntes del mapa y vuelve a intentarlo.";
            }
        }

        function reiniciarJuego() {
            resultScreen.classList.add('hidden');
            iniciarJuego();
        }
        
        function actualizarPuntuacion() {
            scoreElement.textContent = puntuacion;
        }
    </script>
</body>
</html>
